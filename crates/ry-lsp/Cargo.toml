[package]
name = "ry-lsp"
description = "Language Server Protocol implementation for ry, a static analyzer for R."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
ry-core = { path = "../ry-core" }
ry-checker = { path = "../ry-checker" }
ry-typeshed = { path = "../ry-typeshed" }
ry-config = { path = "../ry-config" }
ry-workspace = { path = "../ry-workspace" }
tower-lsp = "0.20"
tokio = { workspace = true, features = ["rt", "io-std", "sync", "time"] }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[features]
# Test-only instrumentation: the parse/didChange scheduling barrier and
# the baseline disk-read counter. Enabled for this crate's own
# integration tests via the self dev-dependency below; nothing in the
# production dependency graph (ry-cli's `ry server`) enables it, so the
# instrumentation never compiles into shipped binaries.
test-util = []

[dev-dependencies]
ry-lsp = { path = ".", features = ["test-util"] }
ry-testkit = { path = "../ry-testkit" }
proptest = { workspace = true }
