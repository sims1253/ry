name: Nightly fuzz

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

# Fuzz has no PR or push trigger, so the group only matters when a manual
# dispatch overlaps the nightly run on main: the superseded run is
# cancelled instead of burning runner minutes in parallel.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb # nightly
      - name: Install cargo-fuzz
        run: cargo +nightly install cargo-fuzz
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            .
            fuzz
      - name: Fuzz parse (5 min)
        run: cargo +nightly fuzz run parse -- -max_total_time=300 -max_len=4096
      - name: Fuzz parse-and-check (5 min)
        run: cargo +nightly fuzz run parse-and-check -- -max_total_time=300 -max_len=4096
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crash-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore
