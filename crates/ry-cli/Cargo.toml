[package]
name = "ry-cli"
description = "Command-line interface for ry, a static analyzer for R."
keywords = ["r", "linter", "static-analysis", "type-checker"]
categories = ["command-line-utilities", "development-tools"]
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "ry"
path = "src/main.rs"

[dependencies]
ry-core = { path = "../ry-core" }
ry-checker = { path = "../ry-checker" }
ry-typeshed = { path = "../ry-typeshed" }
ry-config = { path = "../ry-config" }
ry-workspace = { path = "../ry-workspace" }
ry-lsp = { path = "../ry-lsp" }
clap = { workspace = true }
clap_complete = { workspace = true }
miette = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# Runtime features for driving the LSP server from synchronous main.
tokio = { workspace = true, features = ["rt-multi-thread", "io-std"] }
# Parallel file parsing with a parser reused on each rayon thread.
rayon = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
ry-testkit = { path = "../ry-testkit" }
tempfile = { workspace = true }
