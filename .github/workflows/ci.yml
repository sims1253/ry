name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@49fda20b3f489226feadfba7767be1db54e2cee1 # 1.90.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo check --workspace --all-targets

  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Test
        run: cargo test --workspace
      - name: Test typeshed sync
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Performance regression tests
        run: cargo test -p ry-checker --test perf --release -- --ignored --test-threads=1
      - name: Clippy (deny warnings)
        # RUSTFLAGS in the env block denies warnings workflow-wide; cargo
        # forwards it to the clippy driver, so a step-level flag is
        # redundant.
        run: cargo clippy --workspace --all-targets
      - name: rustfmt
        run: cargo fmt --all -- --check

  integration-recipes:
    name: Project-check recipes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned ry release
        shell: bash
        env:
          RY_CLI_INSTALL_DIR: ${{ runner.temp }}/ry-cli
          RY_CLI_NO_MODIFY_PATH: "1"
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/sims1253/ry/releases/download/v0.11.0/ry-cli-installer.sh | sh
          echo "$RY_CLI_INSTALL_DIR" >> "$GITHUB_PATH"
      - name: Install hook runners
        run: |
          python3 -m venv "$RUNNER_TEMP/ry-hooks"
          "$RUNNER_TEMP/ry-hooks/bin/python" -m pip install --disable-pip-version-check pre-commit==4.6.2 prek==0.5.4
      - name: Validate and execute committed examples
        run: |
          "$RUNNER_TEMP/ry-hooks/bin/pre-commit" validate-config docs/examples/project-check/.pre-commit-config.yaml
          "$RUNNER_TEMP/ry-hooks/bin/prek" validate-config docs/examples/project-check/.pre-commit-config.yaml
          "$RUNNER_TEMP/ry-hooks/bin/python" scripts/test_project_check_recipe.py \
            --ry "$RUNNER_TEMP/ry-cli/ry" \
            --pre-commit "$RUNNER_TEMP/ry-hooks/bin/pre-commit" \
            --prek "$RUNNER_TEMP/ry-hooks/bin/prek"

  # release.yml is autogenerated by cargo-dist and must byte-match the
  # output of the pinned dist version, or the release workflow refuses to
  # run. Dependabot once bumped actions/checkout inside it (PR #13),
  # silently breaking the next release. Catch that drift on every PR.
  dist-check:
    name: dist generate --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned cargo-dist
        run: |
          version=$(sed -n 's/^cargo-dist-version = "\(.*\)"/\1/p' dist-workspace.toml)
          curl --proto '=https' --tlsv1.2 -LsSf "https://github.com/axodotdev/cargo-dist/releases/download/v${version}/cargo-dist-installer.sh" | sh
      - name: Test executable checksum generation
        run: python3 -m unittest discover -s scripts/release -p 'test_*.py'
      - name: Check release.yml matches generated output
        run: dist generate --check

  # Run the full oracle matrix with R and its fixture dependencies.
  # build-test checks claim completeness without requiring R.
  oracle:
    name: Oracle (R)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install R
        uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          # Binary packages from Posit Package Manager: fast and no
          # compile-from-source failures for purrr/mirai on ubuntu.
          use-public-rspm: true
      - name: Verify Rscript is on PATH
        # The oracle harness skips cleanly when Rscript is missing, which
        # would let the job pass with zero coverage. Guard against that.
        run: |
          Rscript --version
      - name: Install R packages (oracle fixtures)
        # Fail if fixture dependencies cannot be installed.
        uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          # carrier is purrr's SUGGESTED (not imported) dependency that
          # in_parallel() hard-requires at call time (carrier::crate);
          # without it in_parallel fixtures
          # error even though requireNamespace("purrr") succeeds.
          # The vec_cast oracle fixture probes requireNamespace("vctrs");
          # vctrs arrives today only transitively (dplyr and ggplot2 both
          # import it), so pin it directly rather than trusting that chain.
          packages: |
            any::purrr
            any::mirai
            any::carrier
            any::dplyr
            any::ggplot2
            any::rlang
            any::data.table
            any::testthat
            any::vctrs
      - name: Verify oracle R packages are importable
        # Missing fixture packages must not silently reduce CI coverage.
        run: |
          Rscript -e 'stopifnot(requireNamespace("purrr"), requireNamespace("mirai"), requireNamespace("carrier"), requireNamespace("dplyr"), requireNamespace("ggplot2"), requireNamespace("rlang"), requireNamespace("data.table"), requireNamespace("testthat"), requireNamespace("vctrs"))'
      # Typeshed auditing and stub generation moved to the r-typeshed
      # repository together with the stubs; its CI covers them.
      - name: Oracle suite
        run: cargo test -p ry-checker --test oracle --test semantic_lists -- --include-ignored --nocapture
      - name: Bounded R semantic generation
        env:
          RY_SEMANTIC_R_REQUIRED: "1"
          RY_SEMANTIC_ARTIFACT_DIR: ${{ runner.temp }}/semantic-generation
        run: cargo test -p ry-checker --test semantic_generation small_r_semantic_batch -- --exact --nocapture
      - name: Upload semantic generation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semantic-generation
          path: ${{ runner.temp }}/semantic-generation/
          if-no-files-found: ignore

  # The Zed extension is excluded from the root workspace because
  # zed_extension_api does not follow ry's MSRV (CONTRIBUTING.md), so
  # --workspace cannot build it. It keeps its own Cargo.lock; this job
  # builds and tests it through its own manifest.
  zed-extension:
    name: Zed extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Install Zed extension target
        run: rustup target add wasm32-wasip2
      - name: Build Zed extension (WASM)
        run: cargo build --locked --manifest-path editors/zed/Cargo.toml --target wasm32-wasip2
      - name: Test Zed extension
        run: cargo test --locked --manifest-path editors/zed/Cargo.toml
