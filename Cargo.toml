[workspace]
resolver = "2"
members = [
    "crates/ry-core",
    "crates/ry-checker",
    "crates/ry-typeshed",
    "crates/ry-config",
    "crates/ry-cli",
    "crates/ry-lsp",
]
# The Zed extension (editors/zed) is a standalone WASM cdylib kept out of the
# workspace on purpose: zed_extension_api and its transitive dependencies are
# not held to ry's MSRV (1.88), and it builds to wasm32-wasip2, not the native
# target. It has its own Cargo.lock and is built in a separate CI job. See
# plan 32, E5 / R1.
exclude = ["editors/zed"]

[workspace.package]
version = "0.8.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/sims1253/ry"
authors = ["Maximilian Scholz"]

[workspace.dependencies]
# parsing
tree-sitter = "0.26"
tree-sitter-r = "1.3"
# error plumbing
thiserror = "2"
miette = { version = "7", features = ["fancy"] }
# cli
clap = { version = "4", features = ["derive"] }
clap_complete = "4.6.7"
# misc
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = "1"
toml = "1.1.2"
glob = "0.3"
tempfile = "3"
insta = { version = "1.48.0", features = ["yaml"] }
# parallelism (Project::check pass 3 + CLI parsing)
rayon = "1"
# Static inventory of R serialized data files (never evaluates R code).
rds2rust = "0.2.0"
bzip2 = "0.6"
flate2 = "1"
xz2 = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1

# Profile cargo-dist builds release artifacts with.
[profile.dist]
inherits = "release"
