[workspace]
members = ["cargo:crates/ry-cli"]

[dist]
cargo-dist-version = "0.32.0"
ci = "github"
create-release = true
installers = ["shell", "powershell"]
windows-archive = ".zip"
unix-archive = ".tar.gz"
targets = [
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
]
precise-builds = true
auto-includes = false
pr-run-mode = "skip"
dispatch-releases = true
install-path = ["$XDG_BIN_HOME/", "$XDG_DATA_HOME/../bin", "~/.local/bin"]
install-updater = false

[dist.github-custom-runners]
global = "ubuntu-latest"

[dist.github-custom-runners.x86_64-apple-darwin]
runner = "macos-15"

[dist.github-custom-runners.aarch64-apple-darwin]
runner = "macos-14"

[dist.github-custom-runners.x86_64-pc-windows-msvc]
runner = "windows-2022"

[dist.github-custom-runners.aarch64-pc-windows-msvc]
runner = "ubuntu-latest"
host = "x86_64-unknown-linux-gnu"
container = { image = "messense/cargo-xwin", host = "x86_64-unknown-linux-musl", package_manager = "apt" }

# Pin the GitHub Actions dist references in the generated release.yml to
# immutable commit SHAs (zizmor: unpinned-uses). Update by changing the SHA
# and re-running `dist generate` (the dist-check CI job enforces byte-match).
[dist.github-action-commits]
"actions/checkout" = "d23441a48e516b6c34aea4fa41551a30e30af803" # v6
"actions/upload-artifact" = "043fb46d1a93c77aae656e7c1c64a875d1fc6a0a" # v7
"actions/download-artifact" = "3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c" # v8
