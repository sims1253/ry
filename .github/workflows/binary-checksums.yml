name: Executable checksums

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: read

jobs:
  binary-checksums:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: artifacts-build-local-*
          path: target/distrib
          merge-multiple: true
      - name: Verify archives and hash executables
        run: python3 scripts/release/binary_checksums.py --artifacts target/distrib --output target/binary-checksums
      # The generated host job collects artifacts-* before creating the
      # release. Failure here blocks that job, so no release lacks sidecars.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts-binary-checksums
          path: target/binary-checksums/*.bin.sha256
          if-no-files-found: error
