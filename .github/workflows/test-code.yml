name: Test VS Code extension

on:
  push:
    branches: [main]
    paths:
      - "editors/code/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/test-code.yml"
  pull_request:
    paths:
      - "editors/code/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/test-code.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: editors/code

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Build ry binary
        working-directory: .
        run: cargo build --release -p ry-cli
      - name: Add ry to PATH
        run: echo "$(pwd)/target/release" >> $GITHUB_PATH
        working-directory: .
      - run: bun install --frozen-lockfile
      - name: Run tests (xvfb)
        run: xvfb-run -a bun run test

  # P37-W3b: Publisher identity consistency check
  publisher-consistency:
    runs-on: ubuntu-latest
    # The workflow-level default working-directory is editors/code; this job
    # inspects paths relative to the repository root.
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Verify publisher identity is consistent
        run: |
          set -euo pipefail
          pkg_publisher=$(jq -r '.publisher' editors/code/package.json)
          pkg_name=$(jq -r '.name' editors/code/package.json)
          ext_id="${pkg_publisher}.${pkg_name}"
          ts_id=$(grep 'RY_EXTENSION_ID' editors/code/src/common/constants.ts | sed 's/.*= "//;s/".*//')
          readme_id=$(grep -oP 'itemName=\K[^")\s]+' README.md | head -1)
          echo "package.json: ${ext_id}"
          echo "constants.ts: ${ts_id}"
          echo "README.md:    ${readme_id}"
          [[ "${ext_id}" == "${ts_id}" ]] || { echo "ERROR: package.json != constants.ts"; exit 1; }
          [[ "${ext_id}" == "${readme_id}" ]] || { echo "ERROR: package.json != README.md"; exit 1; }
          echo "All publisher identities agree: ${ext_id}"
