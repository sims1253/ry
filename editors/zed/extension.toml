id = "ry-lsp"
name = "ry"
description = "Static type checker for R"
version = "0.9.0"
schema_version = 1
authors = ["Maximilian Scholz"]
repository = "https://github.com/sims1253/ry"

# The extension downloads the ry server from GitHub releases over HTTPS.
# Each downloaded executable is checked against its release .bin.sha256
# sidecar before use, including cached downloads. Automatic downloads require
# a release with sidecars (0.9.0 or newer). Settings/PATH binaries are user-managed.
# Minimum compatible server version: 0.8.0 (the first release with
# the `server` subcommand and LSP support).
[language_servers.ry]
name = "ry"
languages = ["R"]
