name: Platforms

# ry ships macOS and Windows binaries, but ci.yml tests only on Linux.
# This runs the workspace tests on those platforms daily rather than per
# PR, to keep PR latency and runner cost down. A change to this file
# also runs it, so the workflow is proven before it lands.
on:
  schedule:
    - cron: "37 4 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/platforms.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    # Linux Build & test takes about 9 minutes at p90; these runners are
    # slower and often start with a cold cache.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Test
        run: cargo test --locked --workspace --no-fail-fast
