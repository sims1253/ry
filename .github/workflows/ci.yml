name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a pull request cancels its older run. Each push to main gets
# its own group, so no main run is cancelled or replaced while pending: every
# merged commit gets a complete run and saves the caches.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7dcc700092a1a8b9c17ba0e140b4e34e93000946 # 1.90.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --locked --workspace --all-targets

  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    # p90 was about 9 minutes over 100 runs while this job also ran clippy
    # and the release-mode perf tests, which now have their own jobs.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build
        run: cargo build --locked --workspace --all-targets
      - name: Test
        run: cargo test --locked --workspace
      - name: Script unit tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

  # Separate from Build & test so a format or lint error fails in about a
  # minute instead of after the full test run.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt
      - name: rustfmt
        run: cargo fmt --all -- --check
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy (deny warnings)
        # RUSTFLAGS in the env block denies warnings workflow-wide; cargo
        # forwards it to the clippy driver, so a step-level flag is
        # redundant.
        run: cargo clippy --locked --workspace --all-targets

  # The release build is a second full compile. In its own job it runs
  # beside the debug build and test instead of after them, and the timing
  # assertions do not share a runner with the workspace tests.
  perf:
    name: Performance regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Performance regression tests
        run: cargo test --locked -p ry-checker --test perf --release -- --ignored --test-threads=1

  # release.yml is autogenerated by cargo-dist and must byte-match the
  # output of the pinned dist version, or the release workflow refuses to
  # run. Dependabot once bumped actions/checkout inside it (PR #13),
  # silently breaking the next release. Catch that drift on every PR.
  dist-check:
    name: dist generate --check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned cargo-dist
        run: |
          version=$(sed -n 's/^cargo-dist-version = "\(.*\)"/\1/p' dist-workspace.toml)
          curl --proto '=https' --tlsv1.2 -LsSf "https://github.com/axodotdev/cargo-dist/releases/download/v${version}/cargo-dist-installer.sh" | sh
      - name: Test executable checksum generation
        run: python3 -m unittest discover -s scripts/release -p 'test_*.py'
      - name: Check release.yml matches generated output
        run: dist generate --check

  # Run the full oracle matrix with R and its fixture dependencies.
  # build-test checks claim completeness without requiring R.
  oracle:
    name: Oracle (R)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install R
        uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          # Binary packages from Posit Package Manager: fast and no
          # compile-from-source failures for purrr/mirai on ubuntu.
          use-public-rspm: true
      - name: Verify Rscript is on PATH
        # The oracle harness skips cleanly when Rscript is missing, which
        # would let the job pass with zero coverage. Guard against that.
        run: |
          Rscript --version
      - name: Install R packages (oracle fixtures)
        # Fail if fixture dependencies cannot be installed.
        uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          # carrier is purrr's SUGGESTED (not imported) dependency that
          # in_parallel() hard-requires at call time (carrier::crate);
          # without it in_parallel fixtures
          # error even though requireNamespace("purrr") succeeds.
          # The vec_cast oracle fixture probes requireNamespace("vctrs");
          # vctrs arrives today only transitively (dplyr and ggplot2 both
          # import it), so pin it directly rather than trusting that chain.
          packages: |
            any::purrr
            any::mirai
            any::carrier
            any::dplyr
            any::ggplot2
            any::rlang
            any::data.table
            any::testthat
            any::vctrs
            any::box
      - name: Verify oracle R packages are importable
        # Missing fixture packages must not silently reduce CI coverage.
        run: |
          Rscript -e 'stopifnot(requireNamespace("purrr"), requireNamespace("mirai"), requireNamespace("carrier"), requireNamespace("dplyr"), requireNamespace("ggplot2"), requireNamespace("rlang"), requireNamespace("data.table"), requireNamespace("testthat"), requireNamespace("vctrs"), requireNamespace("box"))'
      # Typeshed auditing and stub generation moved to the r-typeshed
      # repository together with the stubs; its CI covers them.
      - name: Oracle suite
        run: cargo test --locked -p ry-checker --test oracle --test semantic_lists -- --include-ignored --nocapture
      - name: dump-facts oracle
        # `# oracle-facts:` fixtures: R arbitrates ry's exported facts (#858).
        run: cargo test --locked -p ry-cli --test e2e facts_oracle -- --include-ignored --nocapture

  # The Zed extension is excluded from the root workspace because
  # zed_extension_api does not follow ry's MSRV (CONTRIBUTING.md), so
  # --workspace cannot build it. It keeps its own Cargo.lock; this job
  # builds and tests it through its own manifest.
  zed-extension:
    name: Zed extension
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Install Zed extension target
        run: rustup target add wasm32-wasip2
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # Zed has its own lockfile and both host and WASM targets.
          workspaces: editors/zed -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build Zed extension (WASM)
        run: cargo build --locked --manifest-path editors/zed/Cargo.toml --target wasm32-wasip2
      - name: Test Zed extension
        run: cargo test --locked --manifest-path editors/zed/Cargo.toml

  # The ruleset requires this job by its name, `Check`, so adding, splitting
  # or renaming the jobs above needs no ruleset change. Add every new job to
  # `needs`. It runs with always() and fails unless every job succeeded:
  # GitHub reports a skipped required check as passing, so a cancelled or
  # skipped job must still fail this one.
  check:
    name: Check
    if: ${{ always() }}
    needs: [msrv, build-test, lint, perf, dist-check, oracle, zed-extension]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' > /dev/null
