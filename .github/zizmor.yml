# zizmor configuration. Inline `# zizmor: ignore[...]` comments are
# preferred; the entries below cover findings that cannot be annotated
# in place. See the per-rule justifications.
rules:
  # artipacked:
  # - pullfrog.yml: the workflow keeps pullfrog's generated reference
  #   shape; only the provider env area was trimmed, the part the file
  #   header marks as editable. The persisted checkout credential is
  #   inert under pullfrog's documented model: the agent mints its own
  #   short-lived OIDC installation tokens for every API call and never
  #   consumes the workflow's GITHUB_TOKEN, and the job's token is
  #   contents: read only. See https://docs.pullfrog.com/security.
  artipacked:
    ignore:
      - pullfrog.yml

  # unpinned-uses, pullfrog.yml: the vendor documents the action as a thin
  # bootstrap — the agent resolves from npm at runtime, so the ref pins only
  # action.yml and the `post:` cleanup step. A commit SHA freezes that
  # cleanup step while the agent keeps moving, which pullfrog warns can fail
  # every run after the agent's work is done, and buys no reproducibility
  # because the reviewed code is never the wrapper. `@v0` tracks the wrapper
  # contract, which is the vendor's recommendation. See
  # https://docs.pullfrog.com/versioning.
  unpinned-uses:
    ignore:
      - pullfrog.yml

  # release.yml is generated by cargo-dist (pinned via cargo-dist-version in
  # dist-workspace.toml) and must byte-match `dist generate --check`, which
  # the dist-check CI job enforces; it cannot be hand-edited, so inline
  # ignores are impossible. Justifications:
  # - excessive-permissions: dist generates a workflow-level
  #   contents: write because the host job creates the GitHub Release;
  #   dist offers no per-job permission scoping.
  # - template-injection: every interpolated value originates from
  #   maintainer-invoked workflow_dispatch inputs or from dist's own plan
  #   outputs computed over the repo's own dist-workspace.toml
  #   (pr-run-mode = "skip": the workflow has no pull_request trigger),
  #   so no untrusted input reaches these run blocks.
  # - unpinned-images: the `container:` value is dist's runtime plan
  #   matrix expression, which zizmor cannot expand; the image it
  #   resolves to is digest-pinned in dist-workspace.toml.
  excessive-permissions:
    ignore:
      - release.yml
  template-injection:
    ignore:
      - release.yml
  unpinned-images:
    ignore:
      - release.yml
