name: Executable checksums

on:
  workflow_call:
    inputs:
      # cargo-dist always passes plan; the caller requires this declaration even though this hook does not read it.
      plan:
        required: true
        type: string

permissions:
  contents: read

jobs:
  binary-checksums:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: artifacts-build-local-*
          path: target/distrib
          merge-multiple: true
      - name: Verify archives and hash executables
        run: python3 scripts/release/binary_checksums.py --artifacts target/distrib --output target/binary-checksums
      # The generated host job collects artifacts-* before creating the
      # release. Failure here blocks that job, so no release lacks sidecars.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts-binary-checksums
          path: target/binary-checksums/*.bin.sha256
          if-no-files-found: error

  native-smoke:
    needs: binary-checksums
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-14
          - target: x86_64-pc-windows-msvc
            runner: windows-2022
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: artifacts-build-local-${{ matrix.target }}
          path: target/distrib
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: artifacts-binary-checksums
          path: target/distrib
      - name: Run the verified native executable
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        shell: bash
        run: python scripts/release/smoke.py --artifacts target/distrib --target "$RELEASE_TARGET" --output target/smoke.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-${{ matrix.target }}
          path: target/smoke.json
          if-no-files-found: error
