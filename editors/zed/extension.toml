id = "ry"
name = "ry"
description = "Static type checker for R"
version = "0.9.0"
schema_version = 1
authors = ["Maximilian Scholz"]
repository = "https://github.com/sims1253/ry"

# P37-W4: The extension downloads the ry server from GitHub releases.
# SHA-256 checksum verification is performed on every download.
# Minimum compatible server version: 0.8.0 (the first release with
# the `server` subcommand and LSP support).
[language_servers.ry]
name = "ry"
languages = ["R"]
